<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes - ERP SUCRE</title>

    <link rel="stylesheet" href="../assets/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/fontawesome.css">
    <link rel="stylesheet" href="reportes.css">

    <script src="../assets/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="reportes.js" defer></script>
</head>

<body>

<div class="container py-4">

    <h3 class="mb-4">Reportes</h3>

    <div class="report-box">

        <label>Fecha Inicio</label>
        <input id="fechaInicio" type="date" class="form-control mb-2">

        <label>Fecha Fin</label>
        <input id="fechaFin" type="date" class="form-control mb-3">

        <label>Tipo de Reporte</label>
        <select id="tipoReporte" class="form-control mb-4">
            <option value="productos">Productos</option>
            <option value="inventario">Inventario</option>
            <option value="contactos">Contactos</option>
            <option value="ventas">Ventas</option>
            <option value="compras">Compras</option>
        </select>

        <div class="d-flex gap-3">
            <button id="btnGenerar" class="btn-sucre">
                <i class="fa-solid fa-chart-line me-1"></i> Generar
            </button>

            <button id="btnExcel" class="btn-excel">
                <i class="fa-solid fa-file-excel me-1"></i> Exportar Excel
            </button>

            <button id="btnPDF" class="btn-pdf">
                <i class="fa-solid fa-file-pdf me-1"></i> Exportar PDF
            </button>
        </div>

    </div>

    <div class="table-responsive mt-4">
        <table class="table">
            <thead id="theadReportes"></thead>
            <tbody id="tbodyReportes"></tbody>
        </table>
    </div>

</div>

</body>
</html>
