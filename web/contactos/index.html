<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos - ERP SUCRE</title>
    <link rel="stylesheet" href="contactos.css">
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; color: #333; }
        h1 { margin-bottom: 5px; }
        p { color: #666; margin-bottom: 20px; }
        .toolbar { display: flex; justify-content: space-between; margin-bottom: 15px; }
        input[type="text"] { padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-nuevo { background: #000; color: #fff; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #000; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
        .btn-edit, .btn-delete { border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
        .btn-edit { background: #3b82f6; color: white; }
        .btn-delete { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <h1>Contactos</h1>
    <p>Clientes, proveedores y empresas.</p>

    <div class="toolbar">
        <input type="text" placeholder="Buscar contacto...">
        <button class="btn-nuevo">+ Nuevo Contacto</button>
    </div>

    <table id="tabla-contactos">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Empresa</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Tipo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="6" style="text-align: center; padding: 20px;">Cargando datos de Supabase...</td>
            </tr>
        </tbody>
    </table>

    <script src="contactos.js"></script>
</body>
</html>
