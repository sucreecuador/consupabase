<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP SUCRE - Gestión de Contactos</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #1e222d; color: #333; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; }
    .main-container { padding: 30px; }
    .card-custom { background: #ffffff; border-radius: 12px; border: none; box-shadow: 0 8px 24px rgba(0,0,0,0.15); padding: 25px; }
    .nav-tabs .nav-link { font-weight: 600; color: #6c757d; border: none; border-bottom: 3px solid transparent; }
    .nav-tabs .nav-link.active { color: #fd7e14; border-bottom: 3px solid #fd7e14; background: transparent; }
    .table-custom thead { background-color: #e9ecef; color: #495057; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-code { background-color: #f1f3f5; color: #495057; border: 1px solid #ced4da; padding: 4px 8px; border-radius: 4px; font-weight: 600; }
  </style>
</head>
<body>

<div class="container-fluid main-container">
  <div class="card card-custom">
    
    <!-- CABECERA -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <h2 class="fw-bold mb-0 text-dark">Gestión de Contactos</h2>
      
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <div class="input-group" style="max-width: 400px;">
          <select id="selectFiltroCampo" class="form-select form-select-sm" style="max-width: 150px;">
            <option value="todos" selected>Buscar en todos</option>
            <option value="codigo">Código</option>
            <option value="ruc">Cédula o RUC</option>
            <option value="nombre">Nombre</option>
            <option value="direccion">Dirección</option>
          </select>
          <input type="text" id="inputBusqueda" class="form-control form-control-sm" placeholder="Buscar...">
          <button id="btnBuscar" class="btn btn-outline-secondary btn-sm" type="button">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

        <button id="btnEditarPorCodigo" class="btn btn-primary btn-sm fw-bold">
          <i class="fa-solid fa-pen-to-square me-1"></i> Editar por Código
        </button>
      </div>
    </div>

    <!-- PESTAÑAS (CLIENTES / PROVEEDORES) -->
    <ul class="nav nav-tabs mb-3" id="pestañasContactos" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tab-clientes" data-tipo="CLIENTE" type="button">
          <i class="fa-solid fa-users me-2"></i>Vista Clientes
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-proveedores" data-tipo="PROVEEDOR" type="button">
          <i class="fa-solid fa-truck-front me-2"></i>Vista Proveedores
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-todos" data-tipo="TODOS" type="button">
          <i class="fa-solid fa-address-book me-2"></i>Todos los Contactos
        </button>
      </li>
    </ul>

    <!-- TABLA DE CONTACTOS -->
    <div class="table-responsive">
      <table class="table table-hover align-middle table-custom mb-0">
        <thead>
          <tr>
            <th>CÓDIGO <i class="fa-solid fa-sort"></i></th>
            <th>CÉDULA O RUC <i class="fa-solid fa-sort"></i></th>
            <th>NOMBRE <i class="fa-solid fa-sort"></i></th>
            <th>DIRECCIÓN <i class="fa-solid fa-sort"></i></th>
            <th>TELÉFONO <i class="fa-solid fa-sort"></i></th>
            <th>EMAIL <i class="fa-solid fa-sort"></i></th>
            <th>CIUDAD <i class="fa-solid fa-sort"></i></th>
            <th>TRANSPORTE <i class="fa-solid fa-sort"></i></th>
            <th class="text-center">ACCIONES</th>
          </tr>
        </thead>
        <tbody id="tbodyContactos">
          <tr>
            <td colspan="9" class="text-center py-4 text-muted">
              <i class="fa-solid fa-spinner fa-spin me-2"></i>Cargando contactos...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- PIE Y PAGINACIÓN -->
    <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
      <small id="lblInfoPaginacion" class="text-muted">Mostrando 0-0 de 0 registros</small>
      
      <div class="d-flex align-items-center gap-2">
        <button id="btnAnterior" class="btn btn-sm btn-light border" disabled>Anterior</button>
        <button id="btnSiguiente" class="btn btn-sm btn-light border" disabled>Siguiente</button>
        <span class="small text-muted ms-2">Ir a página:</span>
        <input type="number" id="inputPagina" class="form-control form-control-sm text-center" style="width: 60px;" value="1" min="1">
        <button id="btnIrPagina" class="btn btn-sm btn-light border">Ir</button>
      </div>
    </div>

  </div>
</div>

<!-- Bootstrap 5 JS & Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="contactos.js"></script>
</body>
</html>
