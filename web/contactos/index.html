<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contactos - ERP SUCRE</title>

    <link rel="stylesheet" href="../assets/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/fontawesome.css">
    <link rel="stylesheet" href="contactos.css">

    <script src="../assets/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="contactos.js" defer></script>
</head>

<body>

<div class="container py-4">

    <h3 class="mb-3 fw-bold">Contactos</h3>

    <div class="d-flex justify-content-between mb-3">

        <div>
            <button id="btnVistaVentas" class="btn-sucre me-2">Ventas</button>
            <button id="btnVistaCompras" class="btn-outline-sucre">Compras</button>
        </div>

        <div>
            <button id="btnAnterior" class="btn-outline-sucre me-2">Anterior</button>
            <button id="btnSiguiente" class="btn-outline-sucre">Siguiente</button>
        </div>

    </div>

    <div class="table-responsive">
        <table class="table">
            <thead id="theadContactos"></thead>
            <tbody id="tbodyContactos"></tbody>
        </table>
    </div>

    <div class="mt-3 text-center">
        <span id="lblInfoPaginacion" class="fw-bold"></span>
    </div>

</div>

<!-- MODAL EDITAR -->
<div class="modal fade" id="modalEditarContacto" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title fw-bold">Editar Contacto</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="editId">

                <label>Código Cliente</label>
                <input id="editCodigo" class="form-control mb-2">

                <label>RUC</label>
                <input id="editRuc" class="form-control mb-2">

                <label>Categoría</label>
                <input id="editCategoria" class="form-control mb-2">

                <label>Nombre / Razón Social</label>
                <input id="editNombre" class="form-control mb-2">

                <label>Dirección</label>
                <input id="editDireccion" class="form-control mb-2">

                <label>Ciudad</label>
                <input id="editCiudad" class="form-control mb-2">

                <label>Teléfono</label>
                <input id="editTelefono" class="form-control mb-2">

                <label>Email</label>
                <input id="editEmail" class="form-control mb-2">

                <label>Transporte</label>
                <input id="editTransporte" class="form-control mb-2">

                <!-- BANCO = COMENTARIO -->
                <label>Banco</label>
                <input id="editBanco" class="form-control mb-2">

                <!-- DATOS BANCARIOS = NECESIDAD -->
                <label>Datos Bancarios</label>
                <input id="editDatosBancarios" class="form-control mb-2">

                <label>Fecha Nacimiento</label>
                <input id="editFecnac" class="form-control mb-2">

                <label>Comentario</label>
                <input id="editComentario" class="form-control mb-2">

                <label>Necesidad</label>
                <input id="editNecesidad" class="form-control mb-2">

            </div>

            <div class="modal-footer">
                <button class="btn-outline-sucre" data-bs-dismiss="modal">Cancelar</button>
                <button id="btnGuardarCambiosContacto" class="btn-sucre">
                    <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Cambios
                </button>
            </div>

        </div>
    </div>
</div>

</body>
</html>
