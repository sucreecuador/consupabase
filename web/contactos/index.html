<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Contactos - ERP SUCRE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1e2530;
            color: #f1f5f9;
            padding: 30px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #28303d;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #3a4556;
        }

        /* Header & Toolbar */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            color: #94a3b8;
        }

        .search-box input {
            background-color: #1e2530;
            border: 1px solid #3a4556;
            color: #ffffff;
            padding: 10px 16px 10px 40px;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 300px;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .search-box input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Tabs Navigation */
        .tabs-nav {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #3a4556;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: #e2e8f0;
        }

        .tab-btn.active-clientes {
            color: #f97316;
            border-bottom-color: #f97316;
        }

        .tab-btn.active-proveedores {
            color: #10b981;
            border-bottom-color: #10b981;
        }

        /* Views Container */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Table Styles */
        .table-container {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #0f172a;
            color: #ffffff;
            padding: 14px 16px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        /* Accent Themes for Tables */
        .theme-clientes th {
            border-top: 3px solid #f97316;
        }

        .theme-proveedores th {
            border-top: 3px solid #10b981;
        }

        tbody tr {
            background-color: #333d4c;
            border-bottom: 1px solid #3a4556;
            transition: background-color 0.15s ease;
        }

        tbody tr:hover {
            background-color: #3d495b;
        }

        td {
            padding: 12px 16px;
            color: #e2e8f0;
            white-space: nowrap;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s ease;
            color: #ffffff;
        }

        .btn-action:hover {
            opacity: 0.85;
        }

        .btn-edit {
            background-color: #3b82f6;
        }

        .btn-delete {
            background-color: #ef4444;
        }

        .badge-code {
            background-color: #1e2530;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            color: #94a3b8;
            border: 1px solid #3a4556;
        }

        .loading-td {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header & Search -->
        <div class="page-header">
            <h1 class="page-title">Gestión de Contactos</h1>
            <div class="toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" onkeyup="filtrarContactos()" placeholder="Buscar contacto...">
                </div>
                <button class="btn-primary">
                    <i class="fa-solid fa-plus"></i> Nuevo Contacto
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs-nav">
            <button class="tab-btn active-clientes" id="btnTabClientes" onclick="cambiarVista('clientes')">
                <i class="fa-solid fa-users" style="color: #f97316;"></i> Vista Clientes
            </button>
            <button class="tab-btn" id="btnTabProveedores" onclick="cambiarVista('proveedores')">
                <i class="fa-solid fa-truck-field" style="color: #10b981;"></i> Vista Proveedores
            </button>
        </div>

        <!-- Vista Clientes -->
        <div id="vistaClientes" class="tab-content active">
            <div class="table-container theme-clientes">
                <table id="tablaClientes">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Cédula o RUC</th>
                            <th>Nombre</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Ciudad</th>
                            <th>Transporte</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="9" class="loading-td"><i class="fa-solid fa-spinner fa-spin"></i> Cargando clientes desde Supabase...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Vista Proveedores -->
        <div id="vistaProveedores" class="tab-content">
            <div class="table-container theme-proveedores">
                <table id="tablaProveedores">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Cédula o RUC</th>
                            <th>Nombre</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Número de Cuenta</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="8" class="loading-td"><i class="fa-solid fa-spinner fa-spin"></i> Cargando proveedores desde Supabase...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="contactos.js"></script>
</body>
</html>
