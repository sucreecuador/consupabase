<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Contactos - ERP SUCRE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a202c;
            color: #1e293b;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            border: 1px solid #cbd5e1;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-container {
            display: flex;
            align-items: center;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 2px 8px;
        }

        .search-field-select {
            background: transparent;
            border: none;
            border-right: 1px solid #cbd5e1;
            padding: 6px 8px;
            font-size: 0.85rem;
            color: #475569;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box i {
            position: absolute;
            left: 10px;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .search-box input {
            background-color: transparent;
            border: none;
            color: #0f172a;
            padding: 8px 12px 8px 32px;
            font-size: 0.9rem;
            width: 240px;
            outline: none;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .tabs-nav {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 16px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #64748b;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active-clientes {
            color: #ea580c;
            border-bottom-color: #ea580c;
        }

        .tab-btn.active-proveedores {
            color: #059669;
            border-bottom-color: #059669;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
            min-width: 1000px;
            background-color: #ffffff;
        }

        th {
            background-color: #e2e8f0;
            color: #1e293b;
            padding: 10px 12px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            border: 1px solid #cbd5e1;
            cursor: pointer;
        }

        .theme-clientes th { border-top: 3px solid #ea580c; }
        .theme-proveedores th { border-top: 3px solid #059669; }

        tbody tr { background-color: #ffffff; }
        tbody tr:nth-child(even) { background-color: #f8fafc; }
        tbody tr:hover { background-color: #f1f5f9; }

        td {
            padding: 8px 12px;
            color: #334155;
            white-space: nowrap;
            border: 1px solid #e2e8f0;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .btn-action {
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #ffffff;
            font-size: 0.8rem;
        }

        .btn-edit { background-color: #2563eb; }
        .btn-delete { background-color: #dc2626; }

        .badge-code {
            background-color: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: 600;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .loading-td {
            text-align: center;
            padding: 24px;
            color: #64748b;
        }

        /* Modal de Edición Real */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(15, 23, 42, 0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .modal-header {
            background: #0f172a;
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
        }

        .form-group input {
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .modal-footer {
            padding: 16px 20px;
            background: #f8fafc;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            border-top: 1px solid #e2e8f0;
        }

        .btn-secondary {
            background: #64748b;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Paginación */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            margin-top: 8px;
            color: #475569;
            font-size: 0.85rem;
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pagination-numbers {
            display: flex;
            gap: 4px;
        }

        .btn-page {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-page.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Gestión de Contactos</h1>
            <div class="toolbar">
                <div class="search-container">
                    <select id="searchField" class="search-field-select" onchange="filtrarContactos()">
                        <option value="todos">Buscar en todos</option>
                        <option value="codigo_cliente">Código</option>
                        <option value="ruc">Cédula / RUC</option>
                        <option value="nombre">Nombre</option>
                        <option value="direccion">Dirección</option>
                        <option value="telefono1">Teléfono</option>
                        <option value="email">Email</option>
                    </select>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" onkeyup="filtrarContactos()" placeholder="Escribe para buscar...">
                    </div>
                </div>
                <button class="btn-primary" onclick="iniciarEdicionPorCodigo()">
                    <i class="fa-solid fa-pen-to-square"></i> Editar por Código
                </button>
            </div>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active-clientes" id="btnTabClientes" onclick="cambiarVista('clientes')">
                <i class="fa-solid fa-users" style="color: #ea580c;"></i> Vista Clientes
            </button>
            <button class="tab-btn" id="btnTabProveedores" onclick="cambiarVista('proveedores')">
                <i class="fa-solid fa-truck-field" style="color: #059669;"></i> Vista Proveedores
            </button>
        </div>

        <div id="vistaClientes" class="tab-content active">
            <div class="table-responsive theme-clientes">
                <table id="tablaClientes">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Cédula o RUC</th>
                            <th>Nombre</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Ciudad</th>
                            <th>Transporte</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="9" class="loading-td"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination-container">
                <span id="infoClientes">Mostrando 0-0 de 0</span>
                <div class="pagination-controls">
                    <button class="btn-page" id="btnPrevClientes" onclick="cambiarPagina(-1)">Anterior</button>
                    <div id="numPagesClientes" class="pagination-numbers"></div>
                    <button class="btn-page" id="btnNextClientes" onclick="cambiarPagina(1)">Siguiente</button>
                </div>
            </div>
        </div>

        <div id="vistaProveedores" class="tab-content">
            <div class="table-responsive theme-proveedores">
                <table id="tablaProveedores">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Cédula o RUC</th>
                            <th>Nombre</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Número de Cuenta</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="8" class="loading-td"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination-container">
                <span id="infoProveedores">Mostrando 0-0 de 0</span>
                <div class="pagination-controls">
                    <button class="btn-page" id="btnPrevProveedores" onclick="cambiarPagina(-1)">Anterior</button>
                    <div id="numPagesProveedores" class="pagination-numbers"></div>
                    <button class="btn-page" id="btnNextProveedores" onclick="cambiarPagina(1)">Siguiente</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Formulario de Edición Real -->
    <div id="modalEdicion" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Editar Contacto</h3>
                <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="cerrarModal()"></i>
            </div>
            <form id="formEdicionContacto" onsubmit="guardarEdicion(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Código (No Modificable)</label>
                        <input type="text" id="edit_codigo_cliente" readonly style="background:#f1f5f9; font-weight:bold;">
                    </div>
                    <div class="form-group">
                        <label>Cédula / RUC</label>
                        <input type="text" id="edit_ruc" required>
                    </div>
                    <div class="form-group full">
                        <label>Nombre / Razón Social</label>
                        <input type="text" id="edit_nombre" required>
                    </div>
                    <div class="form-group full">
                        <label>Dirección</label>
                        <input type="text" id="edit_direccion">
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="edit_telefono1">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="edit_email">
                    </div>
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" id="edit_ciudad">
                    </div>
                    <div class="form-group">
                        <label>Transporte / Cuenta</label>
                        <input type="text" id="edit_transporte">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="contactos.js"></script>
</body>
</html>
