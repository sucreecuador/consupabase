<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contactos - ERP Sucre</title>
    <link rel="stylesheet" href="contactos.css">
    <script src="contactos.js" defer></script>
</head>

<body>

    <div class="header">
        <h1>Contactos</h1>
        <p>Clientes, proveedores y empresas.</p>
    </div>

    <div class="actions">
        <input type="text" id="buscar" placeholder="Buscar contacto...">
        <button id="btnNuevo">➕ Nuevo Contacto</button>
    </div>

    <table class="erp-table">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Empresa</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Tipo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaContactos"></tbody>
    </table>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitulo">Nuevo Contacto</h2>

            <label>Nombre</label>
            <input type="text" id="conNombre">

            <label>Empresa</label>
            <input type="text" id="conEmpresa">

            <label>Teléfono</label>
            <input type="text" id="conTelefono">

            <label>Email</label>
            <input type="email" id="conEmail">

            <label>Tipo</label>
            <select id="conTipo">
                <option value="Cliente">Cliente</option>
                <option value="Proveedor">Proveedor</option>
                <option value="Empresa">Empresa</option>
            </select>

            <div class="modal-actions">
                <button id="btnGuardar">Guardar</button>
                <button id="btnCerrar">Cancelar</button>
            </div>
        </div>
    </div>

</body>
</html>
