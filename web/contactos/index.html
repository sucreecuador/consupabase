<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos - ERP SUCRE</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --sidebar-bg: #1e293b;
            --sidebar-text: #94a3b8;
            --sidebar-active: #ffffff;
            --theme-green: #00a67d;
            --theme-green-hover: #008f6b;
            --excel-header-bg: #e2e8f0;
            --excel-header-border: #cbd5e1;
            --excel-header-text: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 240px;
            min-height: 100vh;
            background-color: var(--sidebar-bg);
            transition: all 0.3s ease;
        }

        #sidebar.d-none {
            display: none !important;
        }

        #sidebar .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            padding: 1.5rem 1.25rem;
            letter-spacing: 0.5px;
        }

        #sidebar .nav-link {
            color: var(--sidebar-text);
            padding: 0.75rem 1.25rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        #sidebar .nav-link:hover, #sidebar .nav-link.active {
            color: var(--sidebar-active);
        }

        #content {
            flex: 1;
            padding: 2rem;
            min-width: 0;
        }

        .btn-green {
            background-color: var(--theme-green);
            color: white;
            border: none;
            font-weight: 500;
        }
        .btn-green:hover {
            background-color: var(--theme-green-hover);
            color: white;
        }

        .btn-toggle-sidebar {
            background-color: #475569;
            color: white;
            border: none;
            font-size: 0.85rem;
        }

        /* Estilo Excel para Encabezado de Tabla */
        .table-excel {
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid var(--excel-header-border);
        }

        .table-excel thead th {
            background-color: var(--excel-header-bg) !important;
            color: var(--excel-header-text) !important;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--excel-header-border) !important;
            border-right: 1px solid var(--excel-header-border) !important;
            padding: 0.65rem 0.5rem;
            vertical-align: middle;
            cursor: pointer;
            user-select: none;
        }

        .table-excel thead th:hover {
            background-color: #cbd5e1 !important;
        }

        .table-excel tbody td {
            font-size: 0.85rem;
            vertical-align: middle;
            color: #334155;
            padding: 0.55rem 0.5rem;
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }

        .table-excel tbody tr:nth-of-type(odd) td {
            background-color: #ffffff;
        }

        .table-excel tbody tr:nth-of-type(even) td {
            background-color: #f8fafc;
        }

        .table-excel tbody tr:hover td {
            background-color: #e0f2fe !important;
        }

        .badge-code {
            background-color: #e2e8f0;
            color: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-cat {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .th-sort-icon {
            font-size: 0.75rem;
            margin-left: 3px;
            opacity: 0.5;
        }

        .th-sort-icon.active {
            opacity: 1;
            color: var(--theme-green);
        }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div id="sidebar">
        <div class="brand">ERP SUCRE</div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="../indicadores/index.html">Indicadores</a></li>
            <li class="nav-item"><a class="nav-link" href="../productos/productos.html">Productos</a></li>
            <li class="nav-item"><a class="nav-link" href="../inventario/index.html">Inventario</a></li>
            <li class="nav-item"><a class="nav-link active" href="index.html">Contactos</a></li>
            <li class="nav-item"><a class="nav-link" href="../reportes/index.html">Reportes</a></li>
            <li class="nav-item"><a class="nav-link" href="../facturacion/index.html">Facturación</a></li>
            <li class="nav-item"><a class="nav-link" href="../configuracion/index.html">Configuración</a></li>
        </ul>
    </div>

    <!-- Content -->
    <div id="content">
        <h2 class="fw-bold text-dark mb-1">Contactos</h2>
        <p class="text-muted small mb-3">Gestión de clientes, proveedores y libreta de contactos</p>

        <button class="btn btn-toggle-sidebar btn-sm mb-3" id="btnToggleSidebar">Ocultar menú</button>

        <!-- Filtros -->
        <div class="row g-2 mb-3">
            <div class="col-md-3">
                <input type="text" id="buscarNombre" class="form-control form-control-sm" placeholder="Buscar por NOMBRE...">
            </div>
            <div class="col-md-2">
                <input type="text" id="buscarCedula" class="form-control form-control-sm" placeholder="Buscar por CÉDULA/RUC...">
            </div>
            <div class="col-md-2">
                <input type="text" id="buscarCodigo" class="form-control form-control-sm" placeholder="Buscar por CÓDIGO...">
            </div>
            <div class="col-md-2">
                <input type="text" id="buscarGeneral" class="form-control form-control-sm" placeholder="Buscar todos...">
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-green btn-sm w-100" id="btnMostrarTodos">Mostrar todos</button>
                <button class="btn btn-green btn-sm w-100" id="btnEditarPorCodigo">+ Editar por Código</button>
            </div>
        </div>

        <!-- Vista Selector (Ventas / Compras) -->
        <div class="mb-3 d-flex gap-2" id="selectorVistas">
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" id="btnVistaVentas" data-tipo="VENTAS">Vista Ventas</button>
            <button class="btn btn-sm btn-secondary rounded-pill active px-3" id="btnVistaCompras" data-tipo="COMPRAS">Vista Compras</button>
        </div>

        <!-- Tabla -->
        <div class="table-responsive bg-white shadow-sm rounded">
            <table class="table table-excel mb-0">
                <thead id="theadContactos">
                    <!-- Dinámico por JS -->
                </thead>
                <tbody id="tbodyContactos">
                    <tr>
                        <td colspan="10" class="text-center py-4 text-muted">
                            <i class="fa-solid fa-spinner fa-spin me-2"></i>Cargando contactos...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Paginación -->
        <div class="d-flex justify-content-between align-items-center mt-3">
            <small id="lblInfoPaginacion" class="text-muted">Mostrando 0-0 de 0 registros</small>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary btn-sm" id="btnAnterior" disabled>Anterior</button>
                <button class="btn btn-outline-secondary btn-sm" id="btnSiguiente" disabled>Siguiente</button>
                <span class="small text-muted ms-2">Ir a página:</span>
                <input type="number" id="inputPagina" class="form-control form-control-sm text-center" style="width: 60px;" value="1" min="1">
                <button class="btn btn-outline-primary btn-sm" id="btnIrPagina">Ir</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Edición Contacto -->
<div class="modal fade" id="modalEditarContacto" tabindex="-1" aria-labelledby="modalEditarContactoLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title" id="modalEditarContactoLabel"><i class="fa-solid fa-user-pen me-2"></i>Editar Contacto</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formEditarContacto">
          <input type="hidden" id="editId">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label fw-bold small">Código Cliente</label>
              <input type="text" id="editCodigo" class="form-control form-control-sm" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold small">Categoría (E, B, C, T, P...)</label>
              <input type="text" id="editCategoria" class="form-control form-control-sm text-uppercase" maxlength="1" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold small">Cédula o RUC</label>
              <input type="text" id="editRuc" class="form-control form-control-sm">
            </div>
            <div class="col-md-12">
              <label class="form-label fw-bold small">Nombre / Razón Social</label>
              <input type="text" id="editNombre" class="form-control form-control-sm" required>
            </div>
            <div class="col-md-8">
              <label class="form-label fw-bold small">Dirección</label>
              <input type="text" id="editDireccion" class="form-control form-control-sm">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold small">Ciudad</label>
              <input type="text" id="editCiudad" class="form-control form-control-sm">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold small">Teléfono</label>
              <input type="text" id="editTelefono" class="form-control form-control-sm">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold small">Email</label>
              <input type="email" id="editEmail" class="form-control form-control-sm">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold small">Transporte</label>
              <input type="text" id="editTransporte" class="form-control form-control-sm">
            </div>
            <div class="col-md-12">
              <label class="form-label fw-bold small">Banco / Datos Pago</label>
              <input type="text" id="editRequiere" class="form-control form-control-sm">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-green btn-sm" id="btnGuardarCambiosContacto">
          <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Cambios
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="contactos.js"></script>
</body>
</html>
