<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP SUCRE - Gestión de Contactos</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --sidebar-bg: #1e293b;
      --sidebar-text: #94a3b8;
      --sidebar-active: #ffffff;
      --header-blue: #e8eef5;
      --btn-green: #00a878;
      --btn-green-hover: #008f66;
      --btn-pill-active: #6c757d;
    }

    body {
      background-color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* SIDEBAR LATERAL */
    .sidebar {
      width: 240px;
      background-color: var(--sidebar-bg);
      min-height: 100vh;
      color: var(--sidebar-text);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      padding-top: 20px;
      transition: all 0.3s;
    }

    .sidebar-brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      padding: 0 24px 24px 24px;
      letter-spacing: 0.5px;
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-menu li a {
      display: block;
      padding: 12px 24px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .sidebar-menu li a:hover, .sidebar-menu li.active a {
      color: var(--sidebar-active);
      background-color: rgba(255, 255, 255, 0.05);
      font-weight: 600;
    }

    /* CONTENIDO PRINCIPAL */
    .main-content {
      margin-left: 240px;
      padding: 30px 40px;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .page-subtitle {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    /* BOTONES PASTILLA PARA VISTAS */
    .btn-pill-toggle {
      border-radius: 20px;
      padding: 6px 20px;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid #ced4da;
      background-color: #ffffff;
      color: #495057;
      transition: all 0.2s;
    }

    .btn-pill-toggle.active {
      background-color: var(--btn-pill-active);
      color: #ffffff;
      border-color: var(--btn-pill-active);
    }

    .btn-green {
      background-color: var(--btn-green);
      color: #ffffff;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
    }

    .btn-green:hover {
      background-color: var(--btn-green-hover);
      color: #ffffff;
    }

    /* ESTILO TABLA EXACTO AL EJEMPLO */
    .table-sucre-container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }

    .table-sucre {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 0;
    }

    .table-sucre thead th {
      background-color: var(--header-blue);
      color: #1e293b;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 12px 10px;
      border-bottom: 1px solid #cbd5e1;
      border-right: 1px solid #cbd5e1;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .table-sucre thead th:last-child {
      border-right: none;
    }

    .table-sucre tbody tr {
      border-bottom: 1px solid #e2e8f0;
      transition: background 0.15s;
    }

    .table-sucre tbody tr:hover {
      background-color: #f1f5f9;
    }

    .table-sucre tbody td {
      padding: 10px;
      font-size: 0.88rem;
      color: #334155;
      border-right: 1px solid #e2e8f0;
      vertical-align: middle;
    }

    .table-sucre tbody td:last-child {
      border-right: none;
    }

    .th-sort-icon {
      font-size: 0.75rem;
      margin-left: 4px;
      color: #64748b;
    }

    .btn-action-icon {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.85rem;
    }
    
    .btn-action-icon:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR LATERAL -->
  <div class="sidebar">
    <div class="sidebar-brand">ERP SUCRE</div>
    <ul class="sidebar-menu">
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Indicadores</a></li>
      <li><a href="#">Productos</a></li>
      <li><a href="#">Inventario</a></li>
      <li class="active"><a href="#">Contactos</a></li>
      <li><a href="#">Reportes</a></li>
      <li><a href="#">Facturación</a></li>
      <li><a href="#">Configuración</a></li>
    </ul>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-content">
    <h1 class="page-title">Contactos</h1>
    <p class="page-subtitle">Gestión de clientes, proveedores y libreta de contactos</p>

    <div class="mb-3">
      <button class="btn btn-secondary btn-sm fw-bold px-3">Ocultar menú</button>
    </div>

    <!-- CAJAS DE BÚSQUEDA TIPO ERP SUCRE -->
    <div class="row g-2 mb-3 align-items-center">
      <div class="col-md-3">
        <input type="text" id="busquedaNombre" class="form-control form-control-sm" placeholder="Buscar por NOMBRE...">
      </div>
      <div class="col-md-2">
        <input type="text" id="busquedaRuc" class="form-control form-control-sm" placeholder="Buscar por RUC...">
      </div>
      <div class="col-md-2">
        <input type="text" id="busquedaCodigo" class="form-control form-control-sm" placeholder="Buscar por CÓDIGO...">
      </div>
      <div class="col-md-2">
        <input type="text" id="busquedaTodos" class="form-control form-control-sm" placeholder="Buscar todos...">
      </div>
      <div class="col-md-auto ms-auto d-flex gap-2">
        <button id="btnMostrarTodos" class="btn btn-green btn-sm">Mostrar todos</button>
        <button id="btnEditarPorCodigo" class="btn btn-green btn-sm">+ Editar por Código</button>
      </div>
    </div>

    <!-- SELECCIÓN DE VISTA TIPO PASTILLA -->
    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-pill-toggle active" id="tab-ventas" data-tipo="VENTAS">Vista Ventas</button>
      <button class="btn btn-pill-toggle" id="tab-compras" data-tipo="COMPRAS">Vista Compras</button>
    </div>

    <!-- TABLA DE CONTACTOS CON COLORIMETRÍA BLUE-PASTEL -->
    <div class="table-sucre-container">
      <div class="table-responsive">
        <table class="table-sucre align-middle">
          <thead id="theadContactos">
            <!-- Encabezado dinámico según vista y ordenamiento -->
          </thead>
          <tbody id="tbodyContactos">
            <tr>
              <td colspan="10" class="text-center py-4 text-muted">
                <i class="fa-solid fa-spinner fa-spin me-2"></i>Cargando contactos...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- PIE Y PAGINACIÓN -->
    <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
      <small id="lblInfoPaginacion" class="text-muted">Mostrando 0-0 de 0 registros</small>
      
      <div class="d-flex align-items-center gap-2">
        <button id="btnAnterior" class="btn btn-sm btn-light border" disabled>Anterior</button>
        <button id="btnSiguiente" class="btn btn-sm btn-light border" disabled>Siguiente</button>
        <span class="small text-muted ms-2">Ir a página:</span>
        <input type="number" id="inputPagina" class="form-control form-control-sm text-center" style="width: 60px;" value="1" min="1">
        <button id="btnIrPagina" class="btn btn-sm btn-light border">Ir</button>
      </div>
    </div>

  </div>

  <!-- Supabase & JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="contactos.js"></script>
</body>
</html>
