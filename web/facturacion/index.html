<!-- MODAL DE BÚSQUEDA DE PRODUCTOS -->
<div class="modal fade" id="modalBuscarProductos" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"><i class="fa-solid fa-boxes-stacked me-2"></i>Resultados de Búsqueda de Productos</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>CÓDIGO</th>
                <th>ORIGEN</th>
                <th>MARCA</th>
                <th>DESCRIPCIÓN</th>
                <th>UNI</th>
                <th>SALDO</th>
                <th>PVP</th>
                <th class="text-center">ACCIÓN</th>
              </tr>
            </thead>
            <tbody id="tbodyResultadosProductos">
              <!-- Se llena dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
