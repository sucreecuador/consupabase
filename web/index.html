<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP SUCRE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #d1d5db;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .window-frame {
            width: 100%;
            max-width: 1100px;
            height: 92vh;
            background-color: #eaeef3;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #b0b8c4;
        }

        .top-header {
            height: 48px;
            background-color: #f3f5f8;
            border-bottom: 1px solid #d0d7de;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: 1.25rem;
            color: #1e293b;
            letter-spacing: -0.5px;
        }

        .brand-icon {
            color: #10b981;
            font-size: 1.1rem;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: #334155;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            background-color: #475569;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .status-pill {
            width: 55px;
            height: 18px;
            background: linear-gradient(180deg, #64748b 0%, #334155 100%);
            border-radius: 10px;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
        }

        .status-pill::after {
            content: '';
            position: absolute;
            right: 2px;
            top: 2px;
            width: 14px;
            height: 14px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 4px #22c55e;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            width: 210px;
            background: linear-gradient(180deg, #243b55 0%, #141e30 100%);
            padding-top: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 3px 0 10px rgba(0,0,0,0.15);
            z-index: 2;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
        }

        .sidebar a:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar a.active {
            color: #ffffff;
            background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 100%);
            border-left: 4px solid #60a5fa;
        }

        .sidebar a i {
            width: 20px;
            text-align: center;
            font-size: 1rem;
        }

        .content-area {
            flex: 1;
            background-color: #f1f4f8;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid #cbd5e1;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 820px;
        }

        .module-card {
            height: 125px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #1e293b;
            font-weight: 600;
            font-size: 1rem;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .module-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        .module-card i {
            font-size: 2.2rem;
            color: #334155;
            stroke-width: 1;
        }

        .card-contactos { background-color: #b0cbe8; }
        .card-productos { background-color: #f8c096; }
        .card-inventario { background-color: #a8dba8; }
        .card-facturacion { background-color: #cca9dd; }
        .card-indicadores { background-color: #f6e58d; }
        .card-reportes { background-color: #81ecec; }
        .card-configuracion { background-color: #cccccc; }

        .card-empty {
            background-color: #dcdde1;
            border-radius: 12px;
            height: 125px;
            opacity: 0.6;
        }

        .bottom-floating-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            border-radius: 20px;
            padding: 4px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            border: 1px solid #cbd5e1;
            font-size: 0.85rem;
            color: #475569;
        }

        .bottom-floating-bar button {
            border: none;
            background: transparent;
            cursor: pointer;
            color: #475569;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="window-frame">
        <header class="top-header">
            <div class="brand">
                <span class="brand-icon">❖</span> ERP SUCRE
            </div>
            <div class="user-area">
                <span>Bienvenido, <strong>Ricardo</strong></span>
                <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="status-pill"></div>
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <a href="/" class="active"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="/web/contactos/index.html"><i class="fa-solid fa-user-group"></i> Contactos</a>
                <a href="/web/productos/productos.html"><i class="fa-solid fa-cube"></i> Productos</a>
                <a href="/web/inventario/index.html"><i class="fa-solid fa-basket-shopping"></i> Inventario</a>
                <a href="/web/facturacion/index.html"><i class="fa-solid fa-file-lines"></i> Facturación</a>
                <a href="/web/dashboard/index.html"><i class="fa-solid fa-chart-line"></i> Indicadores</a>
                <a href="/web/reportes/index.html"><i class="fa-solid fa-table"></i> Reportes</a>
                <a href="/web/configuracion/index.html"><i class="fa-solid fa-gear"></i> Configuración</a>
            </aside>

            <main class="content-area">
                <h1 class="content-title">Inicio</h1>

                <div class="grid-container">
                    <a href="/web/contactos/index.html" class="module-card card-contactos">
                        <i class="fa-solid fa-users"></i>
                        <span>Contactos</span>
                    </a>

                    <a href="/web/productos/productos.html" class="module-card card-productos">
                        <i class="fa-solid fa-box-archive"></i>
                        <span>Productos</span>
                    </a>

                    <a href="/web/inventario/index.html" class="module-card card-inventario">
                        <i class="fa-solid fa-warehouse"></i>
                        <span>Inventario</span>
                    </a>

                    <a href="/web/facturacion/index.html" class="module-card card-facturacion">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                        <span>Facturación</span>
                    </a>

                    <a href="/web/dashboard/index.html" class="module-card card-indicadores">
                        <i class="fa-solid fa-chart-column"></i>
                        <span>Indicadores</span>
                    </a>

                    <a href="/web/reportes/index.html" class="module-card card-reportes">
                        <i class="fa-solid fa-table-cells"></i>
                        <span>Reportes</span>
                    </a>

                    <a href="/web/configuracion/index.html" class="module-card card-configuracion">
                        <i class="fa-solid fa-gear"></i>
                        <span>Configuración</span>
                    </a>

                    <div class="card-empty"></div>
                    <div class="card-empty"></div>
                </div>

                <div class="bottom-floating-bar">
                    <span>&#9679;</span>
                    <button><i class="fa-solid fa-download"></i> Export</button>
                    <button><i class="fa-regular fa-circle-question"></i> Help</button>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
