<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP SUCRE - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; font-family: system-ui, -apple-system, sans-serif; }
        
        /* Header Superior */
        .top-navbar {
            background-color: #e2e8f0;
            border-bottom: 1px solid #cbd5e1;
            padding: 8px 24px;
        }
        .brand-title {
            font-weight: 800;
            color: #1e293b;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .user-pill {
            font-weight: 500;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Sidebar Styling */
        .sidebar {
            min-height: calc(100vh - 49px);
            background: linear-gradient(180deg, #1e3a5f 0%, #0f172a 100%);
            padding-top: 10px;
        }
        .sidebar .nav-link {
            color: #94a3b8;
            font-weight: 500;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            border-radius: 0;
            transition: all 0.2s;
            text-decoration: none;
        }
        .sidebar .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }
        .sidebar .nav-link.active {
            color: #ffffff;
            background-color: #2563eb;
        }

        /* Área Principal */
        .main-content {
            padding: 24px 32px;
            background-color: #f1f5f9;
            min-height: calc(100vh - 49px);
        }
        .page-title {
            color: #0f172a;
            font-weight: 700;
            margin-bottom: 24px;
            font-size: 1.5rem;
        }

        /* Dashboard Tiles */
        .tile-card {
            border: none;
            border-radius: 14px;
            padding: 24px 16px;
            text-align: center;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 140px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .tile-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .tile-icon { font-size: 2.5rem; margin-bottom: 8px; line-height: 1; }
        .tile-label { font-weight: 600; font-size: 1.05rem; }

        /* Colores de las Tarjetas */
        .tile-contacts { background-color: #bfdbfe; color: #1e3a8a; }
        .tile-products { background-color: #fed7aa; color: #7c2d12; }
        .tile-inventory { background-color: #bbf7d0; color: #14532d; }
        .tile-billing { background-color: #e9d5ff; color: #581c87; }
        .tile-indicators { background-color: #fef08a; color: #713f12; }
        .tile-reports { background-color: #a7f3d0; color: #064e3b; }
        .tile-config { background-color: #cbd5e1; color: #334155; }
        .tile-empty { background-color: #e2e8f0; border: 2px dashed #cbd5e1; }
    </style>
</head>
<body>

<!-- Header Superior -->
<header class="top-navbar d-flex justify-content-between align-items-center">
    <div class="brand-title">
        <i class="bi bi-three-dots-vertical text-success"></i> ERP SUCRE
    </div>
    <div class="user-pill">
        <span>Bienvenido, <strong id="user-display-name">Ricardo</strong></span>
        <i class="bi bi-person-circle fs-4"></i>
        <a href="/api/logout" class="btn btn-sm btn-outline-danger ms-2" title="Cerrar Sesión">
            <i class="bi bi-box-arrow-right"></i>
        </a>
    </div>
</header>

<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar Navigation -->
        <nav class="col-md-2 sidebar">
            <div class="nav flex-column">
                <a class="nav-link active" href="/web/index.html"><i class="bi bi-house-door-fill"></i> Inicio</a>
                <a class="nav-link" href="/web/contactos.html"><i class="bi bi-people-fill"></i> Contactos</a>
                <a class="nav-link" href="/web/productos.html"><i class="bi bi-box-seam-fill"></i> Productos</a>
                <a class="nav-link" href="/web/inventario.html"><i class="bi bi-basket3-fill"></i> Inventario</a>
                <a class="nav-link" href="/web/facturacion.html"><i class="bi bi-file-earmark-text-fill"></i> Facturación</a>
                <a class="nav-link" href="/web/indicadores.html"><i class="bi bi-graph-up-arrow"></i> Indicadores</a>
                <a class="nav-link" href="/web/reportes.html"><i class="bi bi-table"></i> Reportes</a>
                <a class="nav-link" href="/web/configuracion.html"><i class="bi bi-gear-fill"></i> Configuración</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-10 main-content">
            <h3 class="page-title">Inicio</h3>

            <div class="row g-4">
                <div class="col-12 col-sm-6 col-md-4">
                    <a href="/web/contactos.html" class="tile-card tile-contacts">
                        <i class="bi bi-people tile-icon"></i>
                        <span class="tile-label">Contactos</span>
                    </a>
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <a href="/web/productos.html" class="tile-card tile-products">
                        <i class="bi bi-box-seam tile-icon"></i>
                        <span class="tile-label">Productos</span>
                    </a>
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <a href="/web/inventario.html" class="tile-card tile-inventory">
                        <i class="bi bi-buildings tile-icon"></i>
                        <span class="tile-label">Inventario</span>
                    </a>
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <a href="/web/facturacion.html" class="tile-card tile-billing">
                        <i class="bi bi-receipt tile-icon"></i>
                        <span class="tile-label">Facturación</span>
                    </a>
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <a href="/web/indicadores.html" class="tile-card tile-indicators">
                        <i class="bi bi-graph-up tile-icon"></i>
                        <span class="tile-label">Indicadores</span>
                    </a>
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <a href="/web/reportes.html" class="tile-card tile-reports">
                        <i class="bi bi-layout-three-columns tile-icon"></i>
                        <span class="tile-label">Reportes</span>
                    </a>
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <a href="/web/configuracion.html" class="tile-card tile-config">
                        <i class="bi bi-gear tile-icon"></i>
                        <span class="tile-label">Configuración</span>
                    </a>
                </div>
                <div class="col-12 col-sm-6 col-md-4"><div class="tile-card tile-empty"></div></div>
                <div class="col-12 col-sm-6 col-md-4"><div class="tile-card tile-empty"></div></div>
            </div>
        </main>
    </div>
</div>

<script>
async function cargarUsuario() {
    const token = localStorage.getItem("access_token");
    try {
        const response = await fetch("/api/configuracion/empresa", {
            headers: token ? { "Authorization": "Bearer " + token } : {}
        });
        if (response.ok) {
            const data = await response.json();
            if (data.usuario) {
                document.getElementById("user-display-name").textContent = data.usuario;
            }
        }
    } catch (e) {
        console.warn("No se pudo cargar el perfil del usuario");
    }
}
cargarUsuario();
</script>

</body>
</html>
