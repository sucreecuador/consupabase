<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Compras PRO - ERP SUCRE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body { background: #f5f6fa; }
        #sidebar {
            width: 240px; background: #1f2937; color: white; min-height: 100vh;
        }
        #sidebar a {
            color: #d1d5db; padding: 12px; display: block; text-decoration: none;
        }
        #sidebar a:hover { background: #374151; color: #fff; }
        .action-btn {
            border: none; background: #e5e7eb; padding: 6px 10px; border-radius: 6px;
        }
        .action-btn:hover { background: #d1d5db; }
        th { cursor: pointer; }
    </style>
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div id="sidebar" class="p-3">
        <h4 class="mb-4">ERP SUCRE</h4>
        <a href="../productos/compras.html">Compras</a>
        <a href="../productos/productos.html">Productos / Ventas</a>
        <a href="../contactos/index.html">Contactos</a>
        <a href="../reportes/index.html">Reportes</a>
    </div>

    <!-- CONTENIDO -->
    <div class="flex-grow-1 p-4">

        <button id="btnToggleSidebar" class="btn btn-secondary mb-3">Ocultar menú</button>

        <h2 class="fw-bold text-dark mb-1">Compras PRO</h2>
        <p class="text-muted small mb-3">Gestión de costos, proveedores y reabastecimiento</p>

        <!-- FILTROS -->
        <div class="row g-2 mb-3">
            <div class="col-md-3">
                <input id="buscarNombre" type="text" class="form-control" placeholder="Buscar por DESCRIPCION...">
            </div>
            <div class="col-md-3">
                <input id="buscarMarca" type="text" class="form-control" placeholder="Buscar por PRO1...">
            </div>
            <div class="col-md-2">
                <input id="buscarCodigo" type="text" class="form-control" placeholder="Buscar por CODIGO...">
            </div>
            <div class="col-md-2">
                <input id="buscarGeneral" type="text" class="form-control" placeholder="Buscar general...">
            </div>
            <div class="col-md-2">
                <button id="btnMostrarTodos" class="btn btn-success w-100">Mostrar todos</button>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-responsive">
            <table id="tablaComprasPRO" class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th data-column="pro1">PRO1</th>
                        <th data-column="pro2">PRO2</th>
                        <th data-column="pro3">PRO3</th>
                        <th data-column="codigo">CODIGO</th>
                        <th data-column="codigo_proveedor">CODIGO PROVEEDOR</th>
                        <th data-column="descripcion">DESCRIPCION</th>
                        <th data-column="saldo_temp">SALDO TEMP</th>
                        <th data-column="costo_prom">COSTO PROM</th>
                        <th data-column="precio_venta">PRECIO VENTA</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="tbodyCompras"></tbody>
            </table>
        </div>

        <!-- PAGINACIÓN -->
        <div class="d-flex align-items-center mt-3">
            <button id="btnAnterior" class="btn btn-outline-primary me-2">Anterior</button>
            <button id="btnSiguiente" class="btn btn-outline-primary me-3">Siguiente</button>

            <span class="me-2">Ir a página:</span>
            <input id="inputPagina" type="number" class="form-control w-auto" value="1" min="1" style="width: 80px;">
            <button id="btnIrPagina" class="btn btn-primary ms-2">Ir</button>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="compras.js"></script>

</body>
</html>
