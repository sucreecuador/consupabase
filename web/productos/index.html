<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - ERP Sucre</title>
    <link rel="stylesheet" href="productos.css?v=3000">
    <script src="productos.js?v=3000" defer></script>
    <style>
        .views-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        .views-bar label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        .btn-view {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            transition: all 0.2s;
        }
        .btn-view.active {
            background-color: #107c41;
            color: white;
            border-color: #107c41;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Productos</h1>
        <p>Gestión de catálogo, precios y stock.</p>
    </div>

    <div class="actions">
        <input type="text" id="buscar" placeholder="Buscar producto por código, descripción o proveedor...">
        <button id="btnNuevo" class="btn-nuevo" onclick="abrirModalCrear()">➕ Nuevo Producto</button>
    </div>

    <!-- BARRA DE VISTAS -->
    <div class="views-bar">
        <label>Vistas:</label>
        <button class="btn-view active" onclick="cambiarVista('vista1', this)">Vista 1</button>
        <button class="btn-view" onclick="cambiarVista('vista2', this)">Vista 2</button>
    </div>

    <div class="table-container">
        <table class="erp-table">
            <thead id="tablaHeader">
                <!-- Encabezados generados dinámicamente desde JS -->
            </thead>
            <tbody id="tablaProductos">
                <tr><td colspan="7" style="text-align:center; padding: 15px;">Cargando datos...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="paginacion" class="paginacion"></div>

</body>
</html>
