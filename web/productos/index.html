<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - ERP Sucre</title>
    <link rel="stylesheet" href="productos.css">
    <style>
        /* Estilos de respaldo para asegurar la cuadrícula Excel siempre */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f3f3; margin: 20px; color: #333; }
        .header h1 { color: #107c41; margin: 0 0 5px 0; font-size: 24px; }
        .sub { color: #666; margin: 0 0 15px 0; font-size: 13px; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .input-buscar { padding: 6px 10px; border: 1px solid #ababab; font-size: 13px; width: 280px; }
        .btn-nuevo { background: #107c41; color: white; border: 1px solid #0c5e31; padding: 6px 12px; font-weight: bold; cursor: pointer; }
        .vistas-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .btn-vista { padding: 5px 14px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-weight: bold; }
        .vista1-activo { background-color: #f97316 !important; color: white !important; border-color: #ea580c !important; }
        .vista2-activo { background-color: #059669 !important; color: white !important; border-color: #047857 !important; }
        .tabla-container { overflow-x: auto; border: 1px solid #d4d4d4; background: white; }
        table.erp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        table.erp-table thead tr { background-color: #107c41; color: white; }
        table.erp-table th, table.erp-table td { padding: 6px 8px; border: 1px solid #d4d4d4; text-align: left; }
        table.erp-table th.col-acciones, table.erp-table td.col-acciones { width: 70px !important; text-align: center; padding: 2px 4px !important; }
        table.erp-table tbody tr:nth-child(even) { background-color: #f3f9f5; }
        table.erp-table tbody tr:hover { background-color: #e2f0d9; }
        .excel-code { font-family: Consolas, monospace; font-weight: bold; color: #107c41; }
        .excel-number { text-align: right; font-weight: 600; }
        .acciones-wrapper { display: flex; justify-content: center; gap: 4px; }
        .btn-editar, .btn-eliminar { width: 24px; height: 24px; padding: 0; font-weight: bold; font-size: 11px; cursor: pointer; border-radius: 3px; border: 1px solid transparent; }
        .btn-editar { background-color: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
        .btn-eliminar { background-color: #fef2f2; color: #dc2626; border-color: #fecaca; }
        .paginacion-bar { margin-top: 15px; display: flex; align-items: center; gap: 6px; font-size: 13px; flex-wrap: wrap; }
        .paginacion-bar button { border: 1px solid #d4d4d4; background: white; padding: 4px 10px; cursor: pointer; font-weight: 600; }
        .input-pagina-saltar { width: 55px; padding: 3px 5px; text-align: center; border: 1px solid #107c41; font-weight: bold; color: #107c41; }
        .btn-ir-pagina { background-color: #107c41 !important; color: white !important; border-color: #0c5e31 !important; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-contenido { background: white; padding: 20px; border-radius: 8px; width: 450px; max-width: 90%; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; color: #107c41; font-size: 18px; }
        .modal-body { display: flex; flex-direction: column; gap: 12px; }
        .campo-form { display: flex; flex-direction: column; gap: 4px; }
        .campo-form label { font-size: 12px; font-weight: bold; color: #555; }
        .campo-form input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .btn-guardar { background: #107c41; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-cancelar { background: #6b7280; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Productos</h1>
        <p class="sub">Gestión de catálogo, precios y stock.</p>
    </div>

    <div class="toolbar">
        <input type="text" id="buscar" class="input-buscar" placeholder="Escribe para buscar en NOMBRE...">
        <button class="btn-nuevo" onclick="nuevoProducto()">➕ Nuevo Producto</button>
    </div>

    <div class="vistas-bar">
        <strong>Vistas:</strong>
        <button id="btnVista1" class="btn-vista vista1-activo">Vista 1</button>
        <button id="btnVista2" class="btn-vista">Vista 2</button>
    </div>

    <div class="tabla-container">
        <table class="erp-table">
            <thead id="tablaHeader"></thead>
            <tbody id="tablaCuerpo">
                <tr><td colspan="10" style="text-align:center;">Cargando datos...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="paginacion" class="paginacion-bar"></div>

    <!-- Modal Formulario de Edición -->
    <div id="modalEditar" class="modal">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>Editar Producto</h2>
                <span onclick="cerrarModal()" style="cursor:pointer; font-size:20px; font-weight:bold;">&times;</span>
            </div>
            <form id="formEditar" onsubmit="guardarEdicion(event)">
                <div class="modal-body">
                    <div class="campo-form">
                        <label>Código:</label>
                        <input type="text" id="edit_codigo" readonly style="background:#eee;">
                    </div>
                    <div class="campo-form">
                        <label>Descripción / Nombre:</label>
                        <input type="text" id="edit_descripcion" required>
                    </div>
                    <div class="campo-form">
                        <label>Marca:</label>
                        <input type="text" id="edit_marca">
                    </div>
                    <div class="campo-form">
                        <label>Precio de Venta ($):</label>
                        <input type="number" step="0.01" id="edit_precio_venta" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-guardar">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="productos.js"></script>
</body>
</html>
