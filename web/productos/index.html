<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - ERP Sucre</title>
    <link rel="stylesheet" href="productos.css?v=2002">
    <script src="productos.js?v=2002" defer></script>
</head>
<body>

    <div class="header">
        <h1>Productos</h1>
        <p>Gestión de catálogo, precios y stock.</p>
    </div>

    <div class="actions">
        <input type="text" id="buscar" placeholder="Buscar producto...">
        <button id="btnNuevo">➕ Nuevo Producto</button>
    </div>

    <div class="table-container">
        <table class="erp-table">
            <thead>
                <tr>
                    <th onclick="ordenar('codigo')">Código ⇕</th>
                    <th onclick="ordenar('descripcion')">Descripción ⇕</th>
                    <th onclick="ordenar('marca')">Marca ⇕</th>
                    <th onclick="ordenar('codigo_proveedor')">Proveedor ⇕</th>
                    <th onclick="ordenar('saldo_temp')">Stock ⇕</th>
                    <th onclick="ordenar('precio_venta')">Precio ⇕</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaProductos"></tbody>
        </table>
    </div>

    <div id="paginacion" class="paginacion"></div>

</body>
</html>
