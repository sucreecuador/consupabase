<!-- web/productos/productos.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos - ERP SUCRE</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="productos.css">
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="productos.js" defer></script>
</head>
<body class="erp-body">

<div id="wrapper">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="erp-sidebar">
        <div class="erp-logo">ERP SUCRE</div>
        <nav class="erp-menu">
            <a href="../index.html" class="erp-menu-item">Inicio</a>
            <a href="../indicadores/index.html" class="erp-menu-item">Indicadores</a>
            <a href="productos.html" class="erp-menu-item active">Productos</a>
            <a href="../inventario/index.html" class="erp-menu-item">Inventario</a>
            <a href="../contactos/index.html" class="erp-menu-item">Contactos</a>
            <a href="../reportes/index.html" class="erp-menu-item">Reportes</a>
            <a href="../facturacion/index.html" class="erp-menu-item">Facturación</a>
            <a href="../configuracion/index.html" class="erp-menu-item">Configuración</a>
        </nav>
    </aside>

    <!-- CONTENIDO -->
    <main id="page-content" class="erp-content">
        <header class="erp-header">
            <div class="erp-header-left">
                <button id="btnToggleMenu" class="btn btn-outline-light btn-sm me-3">☰</button>
                <h1 class="erp-title">Gestión de Productos</h1>
            </div>
            <div class="erp-header-right">
                <button class="btn btn-success" id="btnNuevoProducto">+ Nuevo Producto</button>
            </div>
        </header>

        <!-- BARRA DE BÚSQUEDA -->
        <section class="erp-search-bar">
            <div class="erp-search-main">
                <span class="erp-search-icon">🔍</span>
                <input
                    type="text"
                    id="buscarGlobal"
                    class="erp-search-input"
                    placeholder="Buscar por nombre, código o marca..."
                >
            </div>
            <div class="erp-search-filters">
                <button class="btn btn-sm btn-outline-light" data-filter="todos">Todos</button>
                <button class="btn btn-sm btn-outline-light" data-filter="con-stock">Con Stock</button>
                <button class="btn btn-sm btn-outline-light" data-filter="sin-stock">Sin Stock</button>
            </div>
        </section>

        <!-- PESTAÑAS -->
        <ul class="nav nav-tabs erp-tabs" id="productosTabs">
            <li class="nav-item">
                <button class="nav-link active" id="tabVentas" data-bs-toggle="tab" data-bs-target="#vistaVentas">
                    📦 Ventas
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link compras-tab" id="tabCompras" data-bs-toggle="tab" data-bs-target="#vistaCompras">
                    ⚠️ Compras
                </button>
            </li>
        </ul>

        <div class="tab-content erp-tab-content">
            <!-- VISTA VENTAS -->
            <div class="tab-pane fade show active" id="vistaVentas">
                <div class="table-responsive erp-table-wrapper">
                    <table class="table table-striped table-hover table-dark align-middle" id="tablaVentas">
                        <thead>
                            <tr>
                                <th>CÓDIGO</th>
                                <th>MARCA</th>
                                <th>NOMBRE</th>
                                <th>PVP ($)</th>
                                <th>STOCK TOTAL</th>
                                <th>STOCK UIO</th>
                                <th>STOCK GYE</th>
                                <th>PESO (kg)</th>
                                <th>MEDIDAS</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyVentas"></tbody>
                    </table>
                </div>
            </div>

            <!-- VISTA COMPRAS (solo contenedor, contenido real en compras.html) -->
            <div class="tab-pane fade" id="vistaCompras">
                <div class="erp-compras-placeholder">
                    <p class="text-muted mb-3">
                        Para ver la vista completa de Compras, use <strong>compras.html</strong>.
                    </p>
                    <a href="compras.html" class="btn btn-outline-warning">Ir a Vista Compras</a>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
