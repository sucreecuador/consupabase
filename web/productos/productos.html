<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos - ERP SUCRE</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="productos.js" defer></script>
</head>

<body class="bg-light">

<div class="container-fluid mt-4">

    <h3 class="mb-3">Gestión de Productos</h3>

    <ul class="nav nav-tabs" id="tabsProductos">
        <li class="nav-item">
            <a class="nav-link active" id="tabVentas" href="#">Vista Ventas</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tabCompras" href="compras.html">Vista Compras</a>
        </li>
    </ul>

    <div class="mt-3 d-flex justify-content-between">
        <input type="text" id="buscarVentas" class="form-control w-25" placeholder="Buscar en todos">
        <div>
            <button class="btn btn-primary" id="btnNuevo">+ Nuevo Producto</button>
            <button class="btn btn-success" id="btnExcel">Excel</button>
        </div>
    </div>

    <div class="table-responsive mt-3">
        <table class="table table-striped table-hover" id="tablaProductosVentas">
            <thead class="table-dark">
                <tr>
                    <th data-column="codigo">CÓDIGO</th>
                    <th data-column="naci">ORI</th>
                    <th data-column="marca">MARCA</th>
                    <th data-column="descripcion">NOMBRE</th>
                    <th data-column="unidad">UNI</th>
                    <th data-column="precio_venta">PVP</th>
                    <th data-column="saldo_temp">S.TEM</th>
                    <th data-column="saldo">S UIO</th>
                    <th data-column="saldobext">S GYE</th>
                    <th data-column="peso">PESO</th>
                    <th data-column="medidas">MEDIDAS</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tbodyVentas"></tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between mt-3">
        <button class="btn btn-secondary" id="btnAnterior">Anterior</button>
        <button class="btn btn-secondary" id="btnSiguiente">Siguiente</button>

        <div class="d-flex align-items-center">
            <span class="me-2">Ir a página:</span>
            <input type="number" id="inputPagina" class="form-control w-25 me-2">
            <button class="btn btn-info" id="btnIrPagina">Ir</button>
        </div>
    </div>

</div>

</body>
</html>
