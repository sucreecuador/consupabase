<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - ERP SUCRE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; display: flex; min-height: 100vh; }
        
        .sidebar { width: 220px; background-color: #1e293b; color: #fff; flex-shrink: 0; padding-top: 20px; }
        .sidebar h2 { padding: 0 20px 20px; font-size: 1.2rem; border-bottom: 1px solid #334155; }
        .sidebar nav a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: #cbd5e1; text-decoration: none; font-size: 0.9rem; }
        .sidebar nav a:hover, .sidebar nav a.active { background-color: #334155; color: #fff; }
        
        .main-content { flex: 1; padding: 24px; overflow-x: auto; }
        .page-title-section { margin-bottom: 16px; }
        .page-title-section h1 { font-size: 1.8rem; color: #0f172a; }
        .page-title-section p { color: #64748b; font-size: 0.9rem; }

        .btn-ocultar-menu { background: #64748b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 16px; font-size: 0.85rem; }

        .toolbar-top { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .search-select, .search-input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.9rem; outline: none; }
        .search-input { width: 260px; }
        
        .btn { border: none; padding: 8px 14px; border-radius: 4px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-buscar { background-color: #059669; color: white; }
        .btn-mostrar-todos { background-color: #059669; color: white; }
        .btn-nuevo { background-color: #059669; color: white; }
        .btn-excel { background-color: transparent; color: #059669; border: 1px solid #059669; }

        .tabs-container { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid #cbd5e1; }
        .tab-btn { padding: 8px 16px; border: 1px solid #cbd5e1; border-bottom: none; background: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 0.85rem; border-top-left-radius: 4px; border-top-right-radius: 4px; }
        .tab-btn.active { background: #ffffff; color: #0f172a; border-top: 2px solid #059669; }

        .table-container { background: white; border-radius: 4px; border: 1px solid #cbd5e1; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; }
        th { background-color: #059669; color: white; padding: 10px; font-weight: 700; white-space: nowrap; cursor: pointer; user-select: none; border-right: 1px solid #047857; }
        th:hover { background-color: #047857; }
        td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; border-right: 1px solid #f1f5f9; white-space: nowrap; }
        tbody tr:hover { background-color: #f8fafc; }

        .action-btns { display: flex; gap: 4px; justify-content: center; }
        .btn-action { border: none; width: 26px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 0.75rem; }
        .btn-edit { background-color: #2563eb; }
        .btn-delete { background-color: #dc2626; }

        .status-msg { text-align: center; padding: 24px; color: #dc2626; font-weight: 600; }

        .pagination-container { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 0.85rem; color: #475569; }
        .pagination-controls { display: flex; align-items: center; gap: 6px; }
        .btn-page { background: white; border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }
        .goto-page-container { display: flex; align-items: center; gap: 6px; margin-left: 12px; }
        .goto-page-container input { width: 50px; padding: 3px 6px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: white; border-radius: 6px; width: 100%; max-width: 500px; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #475569; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.85rem; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>ERP SUCRE</h2>
        <nav>
            <a href="#"><i class="fa-solid fa-house"></i> Inicio</a>
            <a href="#"><i class="fa-solid fa-chart-line"></i> Indicadores</a>
            <a href="#" class="active"><i class="fa-solid fa-box"></i> Productos</a>
            <a href="#"><i class="fa-solid fa-warehouse"></i> Inventario</a>
            <a href="#"><i class="fa-solid fa-address-book"></i> Contactos</a>
            <a href="#"><i class="fa-solid fa-file-invoice"></i> Reportes</a>
            <a href="#"><i class="fa-solid fa-receipt"></i> Facturación</a>
            <a href="#"><i class="fa-solid fa-gear"></i> Configuración</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-title-section">
            <h1>Productos</h1>
            <p>Gestión de catálogo, precios y stock</p>
        </div>

        <button class="btn-ocultar-menu">Ocultar menú</button>

        <div class="toolbar-top">
            <select id="searchField" class="search-select">
                <option value="descripcion">Nombre / Descripción</option>
                <option value="codigo">Código</option>
                <option value="cod_prov">Cód. Prov.</option>
                <option value="marca">Marca</option>
            </select>
            <input type="text" id="searchInput" class="search-input" placeholder="Ingrese término a buscar...">
            <button class="btn btn-buscar" onclick="ejecutarBusqueda()"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
            <button class="btn btn-mostrar-todos" onclick="mostrarTodos()"><i class="fa-solid fa-list"></i> Mostrar todos</button>
            <button class="btn btn-nuevo" onclick="abrirModalCrear()"><i class="fa-solid fa-plus"></i> + Nuevo Producto</button>
            <button class="btn btn-excel" onclick="exportarExcel()"><i class="fa-solid fa-file-excel"></i> Generar Excel</button>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" id="tabVentas" onclick="cambiarVista('ventas')">Vista Ventas</button>
            <button class="tab-btn" id="tabCompras" onclick="cambiarVista('compras')">Vista Compras</button>
        </div>

        <div class="table-container">
            <table id="tablaProductos">
                <thead>
                    <tr>
                        <th onclick="ordenar('pro1')">PRO1 <i class="fa-solid fa-sort"></i></th>
                        <th onclick="ordenar('pro2')">PRO2 <i class="fa-solid fa-sort"></i></th>
                        <th onclick="ordenar('pro3')">PRO3 <i class="fa-solid fa-sort"></i></th>
                        <th onclick="ordenar('cod_prov')">CÓD. PROV. <i class="fa-solid fa-sort"></i></th>
                        <th onclick="ordenar('codigo')">CÓDIGO <i class="fa-solid fa-sort"></i></th>
                        <th onclick="ordenar('marca')">MARCA <i class="fa-solid fa-sort"></i></th>
                        <th onclick="ordenar('descripcion')">DESCRIPCIÓN <i class="fa-solid fa-sort"></i></th>
                        <th onclick="ordenar('stem')">S.TEM <i class="fa-solid fa-sort"></i></th>
                        <th onclick="ordenar('costo')">COSTO <i class="fa-solid fa-sort"></i></th>
                        <th onclick="ordenar('pventa')">P.VENTA <i class="fa-solid fa-sort"></i></th>
                        <th style="cursor:default; text-align:center;">ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="11" class="status-msg">Cargando datos...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-container">
            <span id="infoPagina">Mostrando 0-0 de 0</span>
            <div class="pagination-controls">
                <button class="btn-page" id="btnPrev" onclick="cambiarPagina(-1)">Anterior</button>
                <button class="btn-page" id="btnNext" onclick="cambiarPagina(1)">Siguiente</button>
                <div class="goto-page-container">
                    <label for="gotoPageInput">Ir a página:</label>
                    <input type="number" id="gotoPageInput" min="1" placeholder="1">
                    <button class="btn-page" onclick="irAPaginaEspecifica()">Ir</button>
                </div>
            </div>
        </div>
    </main>

    <div id="modalEdicion" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitulo">Editar Producto</h3>
                <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="cerrarModal()"></i>
            </div>
            <form id="formProducto" onsubmit="guardarProducto(event)">
                <div class="form-group">
                    <label>CÓDIGO</label>
                    <input type="text" id="form_codigo" required>
                </div>
                <div class="form-group">
                    <label>CÓD. PROV.</label>
                    <input type="text" id="form_cod_prov">
                </div>
                <div class="form-group">
                    <label>MARCA</label>
                    <input type="text" id="form_marca">
                </div>
                <div class="form-group">
                    <label>DESCRIPCIÓN</label>
                    <input type="text" id="form_descripcion" required>
                </div>
                <div class="form-group">
                    <label>STOCK / S.TEM</label>
                    <input type="number" id="form_stem" value="0">
                </div>
                <div class="form-group">
                    <label>COSTO</label>
                    <input type="number" step="0.01" id="form_costo" value="0.00">
                </div>
                <div class="form-group">
                    <label>PRECIO VENTA</label>
                    <input type="number" step="0.01" id="form_pventa" value="0.00">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" style="background:#64748b; color:white;" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn" style="background:#059669; color:white;">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="productos.js"></script>
</body>
</html>
