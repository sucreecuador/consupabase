<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos - ERP SUCRE</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="productos.js" defer></script>
    <style>
        th.sortable {
            cursor: pointer;
            user-select: none;
        }
        th.sortable:hover {
            background-color: #343a40 !important;
        }
        .sort-icon {
            font-size: 0.8rem;
            margin-left: 4px;
        }
    </style>
</head>

<body class="bg-light">

<div class="container-fluid mt-4">

    <h3 class="mb-3">Gestión de Productos</h3>

    <ul class="nav nav-tabs" id="tabsProductos">
        <li class="nav-item">
            <a class="nav-link active" id="tabVentas" href="#">Vista Ventas</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tabCompras" href="compras.html">Vista Compras</a>
        </li>
    </ul>

    <div class="mt-3 d-flex justify-content-between">
        <div class="d-flex">
            <input type="text" id="buscarVentas" class="form-control me-2" placeholder="Buscar en todos">
            <button class="btn btn-outline-primary" id="btnBuscarVentas">Buscar</button>
        </div>
        <div>
            <button class="btn btn-primary" id="btnNuevo">+ Nuevo Producto</button>
            <button class="btn btn-success" id="btnExcel">Excel</button>
        </div>
    </div>

    <div class="table-responsive mt-3">
        <table class="table table-striped table-hover" id="tablaProductosVentas">
            <thead class="table-dark">
                <tr>
                    <th class="sortable" data-column="codigo">CÓDIGO <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-column="naci">ORI <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-column="marca">MARCA <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-column="descripcion">NOMBRE <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-column="unidad">UNI <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-column="precio_venta">PVP <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-column="saldo_temp">S.TEM <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-column="saldo">S UIO <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-column="saldo_bext">S GYE <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-column="peso">PESO <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-column="medidas">MEDIDAS <span class="sort-icon">↕</span></th>
                    <th class="text-center">ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tbodyVentas"></tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between mt-3">
        <div>
            <button class="btn btn-secondary" id="btnAnterior">Anterior</button>
            <button class="btn btn-secondary" id="btnSiguiente">Siguiente</button>
        </div>

        <div class="d-flex align-items-center">
            <span class="me-2">Ir a página:</span>
            <input type="number" id="inputPagina" class="form-control w-auto me-2" min="1">
            <button class="btn btn-info" id="btnIrPagina">Ir</button>
        </div>
    </div>

</div>

</body>
</html>
