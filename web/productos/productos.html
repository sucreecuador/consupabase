<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP SUCRE - Catálogo de Productos</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #1a252f;
            color: #fff;
        }
        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #2c3e50;
            color: #fff;
        }
        .table-custom th {
            background-color: #f1f3f5;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table-custom td {
            font-size: 0.9rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <nav class="col-md-2 d-none d-md-block sidebar p-3">
            <h3 class="fw-bold mb-4 border-bottom pb-2">ERP SUCRE</h3>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/web/inicio.html"><i class="bi bi-house-door me-2"></i> Inicio</a></li>
                <li class="nav-item"><a href="/web/indicadores.html"><i class="bi bi-graph-up me-2"></i> Indicadores</a></li>
                <li class="nav-item"><a href="/web/productos/productos.html" class="active"><i class="bi bi-box-seam me-2"></i> Productos</a></li>
                <li class="nav-item"><a href="/web/inventario.html"><i class="bi bi-archive me-2"></i> Inventario</a></li>
                <li class="nav-item"><a href="/web/contactos.html"><i class="bi bi-people me-2"></i> Contactos</a></li>
                <li class="nav-item"><a href="/web/reportes.html"><i class="bi bi-file-earmark-bar-graph me-2"></i> Reportes</a></li>
                <li class="nav-item"><a href="/web/facturacion.html"><i class="bi bi-receipt me-2"></i> Facturación</a></li>
                <li class="nav-item"><a href="/web/configuracion.html"><i class="bi bi-gear me-2"></i> Configuración</a></li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="col-md-10 ms-sm-auto px-md-4 py-4">
            
            <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="h2 mb-0 fw-bold">Catálogo de Productos</h1>
                    <p class="text-muted small mb-0">Gestión de inventarios, costos y precios en formato Excel</p>
                </div>
                <div class="d-flex gap-2">
                    <!-- BOTÓN PARA GENERAR EXCEL -->
                    <button class="btn btn-success" onclick="descargarExcelProveedor()">
                        <i class="bi bi-file-earmark-excel me-1"></i> Generar Excel
                    </button>
                    <button class="btn btn-primary" onclick="nuevoProducto()">
                        <i class="bi bi-plus-lg me-1"></i> + Nuevo
                    </button>
                </div>
            </div>

            <!-- Panel de Búsqueda y Filtros -->
            <div class="card mb-4 border-0 shadow-sm">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="searchNombre" class="form-label fw-bold small">Nombre</label>
                            <input type="text" id="searchNombre" class="form-control" placeholder="Buscar por NOMBRE...">
                        </div>
                        <div class="col-md-3">
                            <label for="searchMarca" class="form-label fw-bold small">Marca</label>
                            <input type="text" id="searchMarca" class="form-control" placeholder="Buscar por MARCA...">
                        </div>
                        <div class="col-md-2">
                            <label for="searchCodigo" class="form-label fw-bold small">Código</label>
                            <input type="text" id="searchCodigo" class="form-control" placeholder="Buscar por CÓDIGO...">
                        </div>
                        <div class="col-md-2">
                            <label for="searchContacto" class="form-label fw-bold small">Contacto / Proveedor</label>
                            <input type="text" id="searchContacto" class="form-control" placeholder="319">
                        </div>
                        <div class="col-md-2 d-flex align-items-end gap-1">
                            <button class="btn btn-primary w-100" onclick="buscarProductos()">
                                <i class="bi bi-search me-1"></i> Buscar
                            </button>
                            <button class="btn btn-outline-secondary" onclick="mostrarTodos()" title="Mostrar todos">
                                Todos
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de Productos -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-bordered table-custom mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th class="text-center" style="width: 5%;">PRO1</th>
                                    <th class="text-center" style="width: 5%;">PRO2</th>
                                    <th class="text-center" style="width: 5%;">PRO3</th>
                                    <th style="width: 10%;">CÓD. PROV.</th>
                                    <th style="width: 10%;">CÓDIGO</th>
                                    <th style="width: 12%;">MARCA</th>
                                    <th style="width: 28%;">DESCRIPCIÓN</th>
                                    <th class="text-center" style="width: 7%;">S.TEM</th>
                                    <th class="text-end" style="width: 8%;">COSTO</th>
                                    <th class="text-end" style="width: 8%;">P.VENTA</th>
                                    <th class="text-center" style="width: 7%;">ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductosBody">
                                <!-- Las filas se cargan dinámicamente vía JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- Scripts de Bootstrap y Aplicación -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/web/productos/productos.js"></script>

</body>
</html>
