<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos - ERP SUCRE</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/erp.css">
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="productos.js" defer></script>
</head>

<body>

<div class="d-flex" id="wrapper">

    <!-- SIDEBAR -->
    <div id="sidebar" class="bg-dark text-white p-3">
        <h4 class="mb-4">ERP SUCRE</h4>
        <ul class="nav flex-column">
            <li class="nav-item"><a href="../index.html" class="nav-link text-white">Inicio</a></li>
            <li class="nav-item"><a href="../indicadores/index.html" class="nav-link text-white">Indicadores</a></li>
            <li class="nav-item"><a href="productos.html" class="nav-link text-white active">Productos</a></li>
            <li class="nav-item"><a href="../inventario/index.html" class="nav-link text-white">Inventario</a></li>
            <li class="nav-item"><a href="../contactos/index.html" class="nav-link text-white">Contactos</a></li>
            <li class="nav-item"><a href="../reportes/index.html" class="nav-link text-white">Reportes</a></li>
            <li class="nav-item"><a href="../facturacion/index.html" class="nav-link text-white">Facturación</a></li>
            <li class="nav-item"><a href="../configuracion/index.html" class="nav-link text-white">Configuración</a></li>
        </ul>
    </div>

    <!-- CONTENIDO -->
    <div id="page-content" class="p-4 w-100">

        <button class="btn btn-outline-secondary mb-3" id="btnToggleMenu">☰</button>

        <h3 class="mb-3">Productos</h3>

        <div class="row g-2 mb-3">
            <div class="col-md-3">
                <input type="text" id="buscarNombre" class="form-control" placeholder="Buscar por NOMBRE...">
            </div>
            <div class="col-md-3">
                <input type="text" id="buscarMarca" class="form-control" placeholder="Buscar por MARCA...">
            </div>
            <div class="col-md-3">
                <input type="text" id="buscarCodigo" class="form-control" placeholder="Buscar por CÓDIGO...">
            </div>
            <div class="col-md-3 d-flex">
                <input type="text" id="buscarTodos" class="form-control me-2" placeholder="Buscar todos...">
                <button class="btn btn-outline-primary" id="btnBuscarTodos">Buscar</button>
            </div>
        </div>

        <div class="mb-3 d-flex justify-content-between">
            <button class="btn btn-secondary" id="btnMostrarTodos">Mostrar todos</button>
            <button class="btn btn-primary" id="btnNuevo">+ Nuevo Producto</button>
        </div>

        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" href="#">Vista Ventas</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="compras.html">Vista Compras</a>
            </li>
        </ul>

        <div class="table-responsive mt-3">
            <table class="table table-striped table-hover" id="tablaProductosVentas">
                <thead class="table-dark">
                    <tr>
                        <th data-column="codigo">CÓDIGO</th>
                        <th data-column="naci">ORI</th>
                        <th data-column="marca">MARCA</th>
                        <th data-column="descripcion">NOMBRE</th>
                        <th data-column="unidad">UNI</th>
                        <th data-column="precio_venta">PVP</th>
                        <th data-column="saldo_temp">S.TEM</th>
                        <th data-column="saldo">S UIO</th>
                        <th data-column="saldobext">S GYE</th>
                        <th data-column="peso">PESO</th>
                        <th data-column="medidas">MEDIDAS</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="tbodyVentas"></tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <div>
                <button class="btn btn-secondary" id="btnAnterior">Anterior</button>
                <button class="btn btn-secondary" id="btnSiguiente">Siguiente</button>
            </div>

            <div class="d-flex align-items-center">
                <span class="me-2">Ir a página:</span>
                <input type="number" id="inputPagina" class="form-control w-auto me-2" min="1">
                <button class="btn btn-info" id="btnIrPagina">Ir</button>
            </div>
        </div>

    </div>
</div>

</body>
</html>
