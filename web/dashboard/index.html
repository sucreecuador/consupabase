<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Indicadores - ERP SUCRE</title>

    <link rel="stylesheet" href="../assets/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/fontawesome.css">
    <link rel="stylesheet" href="dashboard.css">

    <script src="../assets/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="dashboard.js" defer></script>
</head>

<body>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Indicadores</h3>
        <button id="btnActualizar" class="btn-sucre">
            <i class="fa-solid fa-rotate me-1"></i> Actualizar
        </button>
    </div>

    <p class="text-muted mb-4">
        Resumen ejecutivo del ERP: productos, contactos, ventas y compras.
    </p>

    <div class="row g-3">

        <!-- Total Productos -->
        <div class="col-md-3 col-sm-6">
            <div class="card-indicador">
                <div class="card-indicador-icon">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <div>
                    <div class="card-indicador-title">Productos</div>
                    <div class="card-indicador-subtitle">Catálogo activo</div>
                    <div id="indProductos" class="card-indicador-value">0</div>
                </div>
            </div>
        </div>

        <!-- Total Contactos -->
        <div class="col-md-3 col-sm-6">
            <div class="card-indicador">
                <div class="card-indicador-icon">
                    <i class="fa-solid fa-address-book"></i>
                </div>
                <div>
                    <div class="card-indicador-title">Contactos</div>
                    <div class="card-indicador-subtitle">Clientes y proveedores</div>
                    <div id="indContactos" class="card-indicador-value">0</div>
                </div>
            </div>
        </div>

        <!-- Total Ventas -->
        <div class="col-md-3 col-sm-6">
            <div class="card-indicador">
                <div class="card-indicador-icon">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                </div>
                <div>
                    <div class="card-indicador-title">Ventas</div>
                    <div class="card-indicador-subtitle">Documentos emitidos</div>
                    <div id="indVentas" class="card-indicador-value">0</div>
                </div>
            </div>
        </div>

        <!-- Total Compras -->
        <div class="col-md-3 col-sm-6">
            <div class="card-indicador">
                <div class="card-indicador-icon">
                    <i class="fa-solid fa-truck-ramp-box"></i>
                </div>
                <div>
                    <div class="card-indicador-title">Compras</div>
                    <div class="card-indicador-subtitle">Órdenes registradas</div>
                    <div id="indCompras" class="card-indicador-value">0</div>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
