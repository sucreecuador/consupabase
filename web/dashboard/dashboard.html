<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CONSUPABASE ERP - Dashboard</title>

    <link rel="stylesheet" href="/web/dashboard/dashboard.css">
    <script src="/web/dashboard/dashboard.js" defer></script>
</head>

<body>

    <!-- Sidebar embebido -->
    <iframe id="sidebar-frame" src="/web/components/sidebar/sidebar.html"></iframe>

    <!-- Contenedor principal del ERP -->
    <div id="erp-main">

        <!-- Encabezado superior -->
        <header id="erp-header">
            <div class="erp-header-left">
                <h1>Dashboard ERP</h1>
                <p>Panel principal de CONSUPABASE ERP</p>
            </div>
            <div class="erp-header-right">
                <span class="erp-user">👤 Ricardo</span>
            </div>
        </header>

        <!-- Tarjetas KPI -->
        <section id="erp-kpi">
            <div class="kpi-card kpi-ventas">
                <div class="kpi-title">Ventas del día</div>
                <div class="kpi-value">$ 0,00</div>
                <div class="kpi-sub">Sin datos aún</div>
            </div>

            <div class="kpi-card kpi-inventario">
                <div class="kpi-title">Productos en inventario</div>
                <div class="kpi-value">0</div>
                <div class="kpi-sub">Pendiente de integración</div>
            </div>

            <div class="kpi-card kpi-clientes">
                <div class="kpi-title">Clientes activos</div>
                <div class="kpi-value">0</div>
                <div class="kpi-sub">Pendiente de integración</div>
            </div>

            <div class="kpi-card kpi-alertas">
                <div class="kpi-title">Alertas</div>
                <div class="kpi-value">0</div>
                <div class="kpi-sub">Sin alertas por ahora</div>
            </div>
        </section>

        <!-- Contenido dinámico (módulos) -->
        <section id="erp-content">
            <!-- Aquí se cargan los módulos (dashboard-module, productos, etc.) -->
        </section>

    </div>

</body>
</html>
