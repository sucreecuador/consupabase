<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard ERP</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; }
    </style>
</head>
<body>

    <h1>Dashboard ERP</h1>

    <div class="card">
        <h2>Total de Productos</h2>
        <p id="total-productos">Cargando...</p>
    </div>

    <script>
        async function cargarDashboard() {
            try {
                const url = "https://consupabase-api.onrender.com/productos";
                const res = await fetch(url);
                const json = await res.json();

                document.getElementById("total-productos").innerText =
                    json.count + " productos registrados";
            } catch (error) {
                document.getElementById("total-productos").innerText =
                    "Error al cargar datos";
            }
        }

        cargarDashboard();
    </script>

</body>
</html>
