<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario - CONSUPABASE</title>

    <style>
        body { font-family: Arial; padding: 20px; background: #f7f7f7; }
        h1 { text-align: center; color: #005bbb; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        th { background: #005bbb; color: white; }
        .nav button { padding: 10px; background: #005bbb; color: white; border: none; border-radius: 6px; }
    </style>
</head>

<body>

<div class="nav">
    <button onclick="window.location.href='index.html'">← Volver</button>
</div>

<h1>Inventario General</h1>

<table id="tabla-inventario">
    <thead>
        <tr>
            <th>Producto</th>
            <th>Saldo</th>
            <th>Saldo BEXT</th>
            <th>Saldo TEMP</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
async function cargarInventario() {
    const url = "https://consupabase-api.onrender.com/productos?page=0&page_size=200";

    const res = await fetch(url);
    const data = await res.json();

    const tbody = document.querySelector("#tabla-inventario tbody");

    data.forEach(p => {
        const fila = `
            <tr>
                <td>${p.descripcion}</td>
                <td>${p.saldo}</td>
                <td>${p.saldo_bext}</td>
                <td>${p.saldo_temp}</td>
            </tr>
        `;
        tbody.innerHTML += fila;
    });
}

cargarInventario();
</script>

</body>
</html>
