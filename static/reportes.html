<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes - CONSUPABASE</title>

    <style>
        body { font-family: Arial; padding: 20px; background: #f7f7f7; }
        h1 { text-align: center; color: #005bbb; }
        .nav button { padding: 10px; background: #005bbb; color: white; border: none; border-radius: 6px; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 0 10px #ccc;
        }
    </style>
</head>

<body>

<div class="nav">
    <button onclick="window.location.href='index.html'">← Volver</button>
</div>

<h1>Reportes</h1>

<div class="card">
    <h2>Resumen de Inventario</h2>
    <p>Total de productos: <span id="total"></span></p>
</div>

<script>
async function cargarReporte() {
    const url = "https://consupabase-api.onrender.com/productos?page=0&page_size=500";

    const res = await fetch(url);
    const data = await res.json();

    document.getElementById("total").innerText = data.length;
}

cargarReporte();
</script>

</body>
</html>
