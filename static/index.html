<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta - Sucre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Botones Superiores de Módulo -->
    <div style="background-color: #e0e0e0; padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid #ccc;">
        <button id="btn-mod-productos" style="background-color: #0056b3; color: white; border: none; padding: 8px 16px; font-weight: bold; cursor: pointer;">
            Consulta de Productos
        </button>
        <button id="btn-mod-contactos" style="background-color: #6c757d; color: white; border: none; padding: 8px 16px; font-weight: bold; cursor: pointer;">
            Consulta de Contactos
        </button>
    </div>

    <div style="padding: 15px;">
        <h2 id="main-title" style="margin-top: 0; font-family: sans-serif;">Consulta de Productos - Sucre</h2>

        <!-- Inputs y Botones de Filtro (Dinamizados por JavaScript) -->
        <div id="filter-container" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-family: sans-serif; font-size: 14px;">
            <!-- JavaScript inyectará aquí los inputs según el módulo -->
        </div>

        <!-- Botones Azules de Búsqueda (Dinamizados por JavaScript) -->
        <div id="action-buttons" style="display: flex; gap: 10px; margin-bottom: 15px;">
            <!-- JavaScript inyectará los botones aquí -->
        </div>

        <!-- Tabla -->
        <div class="table-container">
            <table id="main-table">
                <thead>
                    <tr id="table-headers">
                        <th>CODIGO</th>
                        <th>CODIGO_PROVEEDOR</th>
                        <th>MARCA</th>
                        <th>DESCRIPCION</th>
                        <th>PRECIO_VENTA</th>
                        <th>COSTO_PROM</th>
                        <th>SALDO</th>
                        <th>SALDO_BEXT</th>
                        <th>SALDO_TEMP</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Paginación -->
        <div style="margin-top: 15px; display: flex; align-items: center; gap: 15px; font-family: sans-serif;">
            <button id="btn-prev" style="background-color: #007bff; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer;">← Anterior</button>
            <span id="page-info" style="font-weight: bold;">Página 1 de 1</span>
            <button id="btn-next" style="background-color: #007bff; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer;">Siguiente →</button>
            <span>Ir a página:</span>
            <input type="number" id="input-go-page" style="width: 50px; padding: 4px;">
            <button id="btn-go" style="background-color: #007bff; color: white; border: none; padding: 5px 12px; font-weight: bold; border-radius: 4px; cursor: pointer;">Ir</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
