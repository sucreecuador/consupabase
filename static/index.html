<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta - Sucre</title>
<link rel="stylesheet" href="/static/styles.css">
</head>

<body>

<!-- Menú Superior -->
<div style="margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 5px;">
    <button id="btnTabProductos" onclick="switchTab('productos')" 
        style="background-color: #0056b3; color: white; padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px;">
        Consulta de Productos
    </button>

    <button id="btnTabContactos" onclick="switchTab('contactos')" 
        style="background-color: #6c757d; color: white; padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px;">
        Consulta de Contactos
    </button>
</div>

<!-- Sección Productos -->
<div id="seccionProductos">
    <h2>Consulta de Productos - Sucre</h2>
    
    <div class="filter-container">
        <label>Descripción: <input type="text" id="filtroDesc" placeholder="Buscar..."></label>
        <label>Código: <input type="text" id="filtroCodigo" placeholder="Buscar..."></label>
        <label>Marca: <input type="text" id="filtroMarca" placeholder="Buscar..."></label>
        <label>Proveedor: <input type="text" id="filtroProveedor" placeholder="Buscar..."></label>
        
        <div style="margin-top: 10px;">
            <button id="btnProdVista1" onclick="cambiarVistaProductos(1)" style="background-color: #333; color: white;">Vista 1</button>
            <button id="btnProdVista2" onclick="cambiarVistaProductos(2)" style="background-color: #777; color: white;">Vista 2</button>
        </div>
    </div>

    <div class="table-container">
        <table id="tablaProductos">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="pagination">
        <button onclick="cambiarPagina(-1)" id="btnAnterior">&lt; Anterior</button>
        <span id="infoPaginacion">Página 1 de 1</span>
        <button onclick="cambiarPagina(1)" id="btnSiguiente">Siguiente &gt;</button>
    </div>
</div>

<!-- Sección Contactos -->
<div id="seccionContactos" style="display:none;">
    <h2>Consulta de Contactos - Sucre</h2>
    
    <div class="table-container">
        <table id="tablaContactos">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="pagination">
        <button onclick="cambiarPaginaContacto(-1)" id="btnAnteriorContacto">&lt; Anterior</button>
        <span id="infoPaginacionContacto">Página 1 de 1</span>
        <button onclick="cambiarPaginaContacto(1)" id="btnSiguienteContacto">Siguiente &gt;</button>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
