<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta - Sucre</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Pestañas Superiores -->
    <div class="module-nav">
        <button id="btn-mod-productos" class="btn-module btn-module-active">Consulta de Productos</button>
        <button id="btn-mod-contactos" class="btn-module btn-module-inactive">Consulta de Contactos</button>
    </div>

    <h2 id="main-title">Consulta de Productos - Sucre</h2>

    <!-- Filtros de Entrada -->
    <div id="filter-container" class="filter-row"></div>

    <!-- Botones Azules de Búsqueda -->
    <div id="action-buttons" class="action-row"></div>

    <!-- Tabla -->
    <div class="table-container">
        <table>
            <thead>
                <tr id="table-headers"></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Paginación -->
    <div class="pagination-row">
        <button id="btn-prev" class="btn-blue">← Anterior</button>
        <span id="page-info">Página 1 de 1</span>
        <button id="btn-next" class="btn-blue">Siguiente →</button>
        <span>Ir a página:</span>
        <input type="number" id="input-go-page" value="1">
        <button id="btn-go" class="btn-blue">Ir</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
