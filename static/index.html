<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos - Sucre</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="main-tabs">
        <button class="tab-btn active-tab" onclick="mostrarProductos()">PRODUCTOS</button>
        <button class="tab-btn" onclick="mostrarContactos()">CONTACTOS</button>
    </div>

    <div class="acciones-container">
        <div class="acciones-derecha">
            <button class="btn-verde" onclick="abrirNuevo()">➕ Ingresar</button>
            <button class="btn-naranja" onclick="abrirModificar()">✏️ Modificar</button>
            <button class="btn-rojo" onclick="abrirEliminar()">🗑️ Eliminar</button>
        </div>
    </div>

    <div class="filter-container">
        <div class="filter-grid">
            <label>Descripción
                <input id="descripcion" onkeyup="buscarDescripcion()">
            </label>
            <label>Código
                <input id="codigo" onkeyup="buscarCodigo()">
            </label>
            <label>Marca
                <input id="marca" onkeyup="buscarMarca()">
            </label>
            <label>Proveedor
                <input id="proveedor" onkeyup="buscarProveedor()">
            </label>
        </div>

        <button class="btn-naranja" onclick="mostrarTodos()">Mostrar Todos</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>CODIGO</th>
                    <th>DESCRIPCION</th>
                    <th>MARCA</th>
                    <th>PROVEEDOR</th>
                </tr>
            </thead>
            <tbody id="tabla-body"></tbody>
        </table>
    </div>

    <div class="pagination">
        <div class="pagination-controls">
            <button class="btn-naranja" onclick="anteriorPagina()">Anterior</button>
            <span id="pagina-info" class="pagination-info"></span>
            <button class="btn-verde" onclick="siguientePagina()">Siguiente</button>
        </div>

        <div class="pagination-jump">
            Ir a página:
            <input id="ir-input" type="number" min="1">
            <button class="btn-verde" onclick="irPagina()">Ir</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
