<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta - Sucre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Navegación de Módulos Principal -->
        <div style="margin-bottom: 15px; display: flex; gap: 10px;">
            <button id="btn-mod-productos" style="background-color: #0056b3; color: white; padding: 10px 15px; font-weight: bold; border: none; cursor: pointer;">
                Consulta de Productos
            </button>
            <button id="btn-mod-contactos" style="background-color: #6c757d; color: white; padding: 10px 15px; font-weight: bold; border: none; cursor: pointer;">
                Consulta de Contactos
            </button>
        </div>

        <h2 id="main-title">Consulta de Productos - Sucre</h2>

        <!-- Inputs de Búsqueda -->
        <div id="search-inputs" style="margin-bottom: 15px;">
            <!-- Generado/Actualizado dinámicamente o estructurado -->
        </div>

        <!-- Tabla -->
        <div class="table-container">
            <table>
                <thead>
                    <tr id="table-headers">
                        <th>CODIGO</th>
                        <th>CODIGO_PROVEEDOR</th>
                        <th>MARCA</th>
                        <th>DESCRIPCION</th>
                        <th>PRECIO_VENTA</th>
                        <th>COSTO_PROM</th>
                        <th>SALDO</th>
                        <th>PESO</th>
                        <th>MEDIDAS</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Paginación -->
        <div class="pagination" style="margin-top: 15px;">
            <button id="btn-prev">← Anterior</button>
            <span id="page-info">Página 1 de 1</span>
            <button id="btn-next">Siguiente →</button>
            <span>Ir a página:</span>
            <input type="number" id="input-go-page" style="width: 60px;">
            <button id="btn-go">Ir</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
