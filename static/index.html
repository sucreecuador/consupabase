<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Productos - Sucre</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #e5e5e5; margin: 15px; font-size: 13px; }
        .header-title { font-weight: bold; margin-bottom: 10px; font-size: 16px; }
        
        /* Paneles de Filtro y Botones */
        .top-panel { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .input-group { display: flex; align-items: center; gap: 4px; }
        .input-group input { padding: 4px 6px; border: 1px solid #a0a0a0; background-color: #fff; }
        
        .btn-vista { background-color: #ffd700; border: 1px solid #b39700; padding: 5px 15px; font-weight: bold; cursor: pointer; }
        .btn-vista.active { background-color: #e6c200; border: 2px solid #000; }
        
        .action-panel { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-blue { background-color: #0d6efd; color: white; border: none; padding: 8px 14px; font-weight: bold; cursor: pointer; border-radius: 2px; }
        .btn-blue:hover { background-color: #0b5ed7; }
        
        /* Contenedor de Tabla con Scroll */
        .table-container { 
            background: white; 
            border: 1px solid #b0b0b0; 
            max-height: 550px; 
            overflow-y: auto; 
            overflow-x: auto; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: auto; 
        }
        
        /* Cabecera FIJA al hacer Scroll (Sticky Header) */
        th { 
            position: sticky;
            top: 0;
            z-index: 2; /* Garantiza que los datos pasen por debajo del encabezado */
            background-color: #d8d8d8; 
            border: 1px solid #a0a0a0; 
            padding: 6px; 
            text-align: center; 
            font-size: 11px; 
            font-weight: bold; 
            text-transform: uppercase; 
            white-space: nowrap; 
        }

        td { 
            border: 1px solid #e0e0e0; 
            padding: 5px 6px; 
            font-size: 12px; 
            white-space: nowrap; 
        }
        
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #e9ecef; }
        
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        
        /* Footer Paginación */
        .footer-panel { display: flex; align-items: center; gap: 15px; margin-top: 15px; }
        .btn-page { background-color: #0d6efd; color: white; border: none; padding: 6px 16px; font-weight: bold; cursor: pointer; border-radius: 2px; }
        .btn-page:disabled { background-color: #6c757d; cursor: not-allowed; }
        .goto-group { display: flex; align-items: center; gap: 6px; }
        .goto-group input { width: 50px; padding: 4px; text-align: center; border: 1px solid #a0a0a0; }
    </style>
</head>
<body>

    <div class="header-title">Consulta de Productos - Sucre</div>

    <div class="top-panel">
        <div class="input-group">
            <label>Descripción:</label>
            <input type="text" id="descInput" onkeydown="detectarEnter(event, 'desc')">
        </div>
        <div class="input-group">
            <label>Código:</label>
            <input type="text" id="codigoInput" onkeydown="detectarEnter(event, 'codigo')">
        </div>
        <div class="input-group">
            <label>Marca:</label>
            <input type="text" id="marcaInput" onkeydown="detectarEnter(event, 'marca')">
        </div>
        <div class="input-group">
            <label>Proveedor:</label>
            <input type="text" id="proveedorInput" onkeydown="detectarEnter(event, 'prov')">
        </div>
        <button id="btnVista1" class="btn-vista active" onclick="cambiarVista(1)">Vista 1</button>
        <button id="btnVista2" class="btn-vista" onclick="cambiarVista(2)">Vista 2</button>
    </div>

    <div class="action-panel">
        <button class="btn-blue" onclick="buscarPor('descripcion')">Buscar por descripción</button>
        <button class="btn-blue" onclick="buscarPor('codigo')">Buscar por código</button>
        <button class="btn-blue" onclick="buscarPor('marca')">Buscar por marca</button>
        <button class="btn-blue" onclick="buscarPor('proveedor')">Buscar por proveedor</button>
        <button class="btn-blue" onclick="mostrarTodos()">Mostrar todos</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>CODIGO</th>
                    <th>CODIGO_PROVEEDOR</th>
                    <th>MARCA</th>
                    <th>DESCRIPCION</th>
                    <th>PRECIO_VENTA</th>
                    <th>COSTO_PROM</th>
                    <th>SALDO</th>
                    <th id="thCol8">SALDO_BEXT</th>
                    <th id="thCol9">SALDO_TEMP</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo">
                <!-- Se puebla dinámicamente con JS -->
            </tbody>
        </table>
    </div>

    <div class="footer-panel">
        <button id="btnAnterior" class="btn-page" onclick="anterior()">← Anterior</button>
        <span id="paginaInfo">Página 1 de 1</span>
        <button id="btnSiguiente" class="btn-page" onclick="siguiente()">Siguiente →</button>
        
        <div class="goto-group">
            <span>Ir a página:</span>
            <input type="number" id="irPaginaInput" min="1" onkeydown="irAPaginaEnter(event)">
            <button class="btn-blue" onclick="irAPagina()">Ir</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
